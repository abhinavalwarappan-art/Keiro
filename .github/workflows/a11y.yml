# Accessibility regression gate.
#
# Runs the axe-core Playwright suite (tests/e2e/a11y + tests/e2e/a11y-authed)
# on every PR and push to main. The suite FAILS on any new critical/serious
# axe violation on any route — see tests/e2e/fixtures/a11y.ts for the contract.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  — app boot (env.ts
#   validates at build) and the one shared anonymous guest sign-in the authed
#   specs use. Server-side AI keys are NOT needed: chat replies are mocked.
#   GEMINI_API_KEY may be set to any placeholder if env validation requires it.

name: a11y

on:
  pull_request:
  push:
    branches: [main]

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RATE_LIMIT_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 14
